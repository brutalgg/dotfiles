name: Mirror to GitHub

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitHub
        env:
          # Fine-grained GitHub PAT with contents: read/write on brutalgg/dotfiles.
          # Set in Gitea: repo Settings -> Actions -> Secrets -> MIRROR_TOKEN
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git push --force "https://x-access-token:${TOKEN}@github.com/brutalgg/dotfiles.git" HEAD:main
          git push --force --tags "https://x-access-token:${TOKEN}@github.com/brutalgg/dotfiles.git"
